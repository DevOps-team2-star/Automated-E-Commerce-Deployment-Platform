# Nginx reverse proxy for the shop (deliverable 6).
# The same file is used by docker compose (mounted) and by Kubernetes (ConfigMap generated by
# kustomize from this file), because in both places the services are reachable by the DNS names
# web, search and payment.
#
# Image: nginxinc/nginx-unprivileged (runs as non-root, listens on 8080).

log_format shop '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';

# 10 requests/second per client IP on the payment API, bursts of 20 allowed
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/s;
limit_req_status 429;

upstream web_up     { server web:8080;     keepalive 16; }
upstream search_up  { server search:8081;  keepalive 16; }
upstream payment_up { server payment:8082; keepalive 16; }

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout shop;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;
    proxy_next_upstream   error timeout http_502 http_503;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Liveness/health for Docker, Kubernetes probes and the AWS ALB target group
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Storefront
    location / { proxy_pass http://web_up; }

    # APIs: the trailing slash in proxy_pass strips the /api/<svc> prefix
    location /api/search/  { proxy_pass http://search_up/; }
    location /api/payment/ {
        limit_req zone=payment_limit burst=20 nodelay;
        proxy_pass http://payment_up/;
    }

    # Nginx connection metrics (scraped by nginx-prometheus-exporter); private networks only
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; internal; }
}
