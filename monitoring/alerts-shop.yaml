apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-alerts
  namespace: monitoring
spec:
  groups:
    - name: shop.rules
      rules:
        - alert: ShopHighErrorRate
          expr: |
            sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
              / sum by (service) (rate(http_requests_total[5m])) > 0.05
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.service }}: more than 5% of requests fail with 5xx"
            description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."
        - alert: ShopPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="shop"}[10m]) > 2
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} restarted more than twice in 10 minutes"
        - alert: ShopTargetDown
          expr: up{namespace="shop"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Prometheus cannot scrape {{ $labels.pod }} ({{ $labels.service }})"
        - alert: ShopHPAMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="shop"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="shop"}
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} has been at max replicas for 5 minutes"
