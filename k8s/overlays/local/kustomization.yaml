apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - ../../base
  - postgres.yaml
secretGenerator:
  - name: db-credentials
    envs: [db.env]            # created from db.env.example by scripts/local-k8s-up.sh (git-ignored)
patches:
  - path: hpa-patch.yaml
    target: { kind: HorizontalPodAutoscaler }
# Images built by docker compose and imported into k3d (scripts/local-k8s-up.sh).
# Jenkins overrides these with `kustomize edit set image` to the Docker Hub image of the commit.
images:
  - { name: ecom-web,     newName: local/ecom-web,     newTag: dev }
  - { name: ecom-search,  newName: local/ecom-search,  newTag: dev }
  - { name: ecom-payment, newName: local/ecom-payment, newTag: dev }
  - { name: ecom-db,      newName: local/ecom-db,      newTag: dev }
