# Edge reverse proxy (deliverable 6) - the same default.conf as docker compose, from a ConfigMap.
# Locally: Service type LoadBalancer port 80 (k3d maps host 8080 -> 80).
# On AWS: the ALB targets nodePort 30080 on every node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels: { app: nginx }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: conf, mountPath: /usr/share/nginx/html/50x.html, subPath: 50x.html }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        # Exposes nginx stub_status as Prometheus metrics on :9113 (Part 4)
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/nginx_status"]
          ports:
            - { name: metrics, containerPort: 9113 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: conf
          configMap: { name: nginx-config }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels: { app: nginx }
spec:
  type: LoadBalancer
  selector: { app: nginx }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30080 }
    - { name: metrics, port: 9113, targetPort: metrics }
