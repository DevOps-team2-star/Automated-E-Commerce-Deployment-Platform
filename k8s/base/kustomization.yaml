apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
labels:
  - pairs: { app.kubernetes.io/part-of: shop }
resources:
  - namespace.yaml
  - configmap.yaml
  - web.yaml
  - search.yaml
  - payment.yaml
  - nginx.yaml
  - hpa.yaml
  - pdb.yaml
# Copies of nginx/default.conf and nginx/50x.html (kustomize can't read files outside this folder).
# scripts/check-sync.sh, run by the Jenkins Lint stage, fails if they drift from the originals.
configMapGenerator:
  - name: nginx-config
    files:
      - default.conf=nginx-default.conf
      - 50x.html=nginx-50x.html
